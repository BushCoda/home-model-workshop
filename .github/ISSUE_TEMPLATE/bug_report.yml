name: Bug report
description: Report a problem with Home Model Workshop
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: 0.1.0 beta
    validations:
      required: true
  - type: input
    id: blender-version
    attributes:
      label: Blender version
      placeholder: 5.2.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the room layout and the buttons/actions used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Remove personal or sensitive information before sharing.
    validations:
      required: false
